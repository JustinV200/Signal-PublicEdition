[project]
name = "usage"
version = "0.1.0"
description = "Keeps Claude Code's 5-hour and weekly usage, and the active subagent count, in one JSON file."
authors = [
    { email = "owner@example.com" }
]
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
# Stdlib only: the status line and hooks run on every turn and must start fast.
dependencies = []

[project.scripts]
usage = "usage.cli:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
