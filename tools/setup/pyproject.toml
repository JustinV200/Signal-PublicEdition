[project]
name = "signal-setup"
version = "0.1.0"
description = "First-run setup for Signal: pick tools, install, sign in, wire Claude Code, verify."
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
# Stdlib only: setup runs before anything else is installed.
dependencies = []

[project.scripts]
setup = "signal_setup.cli.main:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
