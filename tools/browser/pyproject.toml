[project]
name = "browser-tool"
version = "0.1.0"
description = "Playwright MCP server that lets Claude drive a browser behind an allowlist, redaction and action gates."
authors = [
    { email = "owner@example.com" }
]
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    # Same pin as tools/audiohub so both servers speak the same MCP SDK version.
    "mcp==2.3.0",
    # Drives the installed Microsoft Edge (channel="msedge"); no browser download.
    "playwright==1.64.0",
    # Text out of downloaded PDFs for read_download (pure Python, run in a child process).
    "pypdf==6.21.2",
    # The shared owner Allow/Deny dialog (packages/confirm, stdlib only).
    "signal-confirm",
    # The shared voice-hub notification client (packages/hubnotify, stdlib only),
    # for the Duo heads-up.
    "signal-hub-notify",
    "vault",
]

[project.scripts]
browser-tool = "browser_tool.server.main:main"
# Visit mode for checker v2: fixed pages, no model (browser_tool/visit/README.md).
browser-tool-visit = "browser_tool.visit.cli:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "browser_tool"

[tool.uv.sources]
vault = { path = "../vault", editable = true }
signal-confirm = { path = "../../packages/confirm", editable = true }
signal-hub-notify = { path = "../../packages/hubnotify", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share basenames across the mirrored folders
# without needing __init__.py files in tests/. `support` holds shared fakes.
# Tests marked `docker` need Docker Desktop, the signal-browser image and the
# internet; they are skipped unless asked for with `pytest -m docker`.
addopts = ["--import-mode=importlib", "-m", "not docker"]
markers = ["docker: drives a real browser container (run with -m docker)"]
pythonpath = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
