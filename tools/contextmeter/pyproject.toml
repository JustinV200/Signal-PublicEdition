[project]
name = "contextmeter"
version = "0.1.0"
description = "Claude Code PostToolUse hook that tells each agent how full its context window is."
requires-python = "==3.12.*"
# Stdlib only: the hook runs after every tool call and must start fast.
dependencies = []

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
