[project]
name = "vault"
version = "0.1.0"
description = "Local credential vault that fills web logins for Claude without any secret reaching the model."
authors = [
    { email = "owner@example.com" }
]
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "cryptography==50.0.2",
    "signal-confirm",
    "winrt-runtime==3.2.1",
    "winrt-Windows.Foundation==3.2.1",
    "winrt-Windows.Security.Credentials==3.2.1",
    "winrt-Windows.Security.Cryptography==3.2.1",
    "winrt-Windows.Storage.Streams==3.2.1",
]

[project.scripts]
vault = "vault.cli.main:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright==1.64.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share basenames across the mirrored folders
# without needing __init__.py files in tests/.
addopts = ["--import-mode=importlib"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.uv.sources]
signal-confirm = { path = "../../packages/confirm", editable = true }
