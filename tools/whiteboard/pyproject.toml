[project]
name = "whiteboard"
version = "0.1.0"
description = "Projector + webcam whiteboard: Claude sees what the owner draws and projects diagrams back."
authors = [
    { email = "owner@example.com" }
]
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    # HTTP + WebSocket daemon that serves the board page and the JSON API.
    "aiohttp==3.14.5",
    # Same pin as tools/audiohub so every Claude session in the repo uses one SDK.
    "claude-agent-sdk==0.2.168",
    # Same pin as tools/audiohub and tools/browser.
    "mcp==2.3.0",
    # Same pin as tools/audiohub.
    "numpy==2.5.4",
    # Webcam capture, ArUco calibration and homography. Latest 4.x: ArUco is in the
    # main module from 4.7, and 5.0 is a new major API we haven't vetted.
    "opencv-python==4.14.0.94",
    # The shared owner Allow/Deny dialog (packages/confirm, stdlib only).
    "signal-confirm",
    # The console's task list and the usage line for board_tasks_show (packages/tasks).
    "signal-tasks",
    # signal-tasks' own path dependency (packages/jsonstate), listed so uv finds it.
    "signal-jsonstate",
    # Keyless weather and IP location for the idle view (packages/weather, stdlib only).
    "signal-weather",
]

[project.scripts]
whiteboard = "whiteboard.cli.main:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share basenames across the mirrored folders
# without needing __init__.py files in tests/.
addopts = ["--import-mode=importlib"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.uv.sources]
signal-confirm = { path = "../../packages/confirm", editable = true }
signal-tasks = { path = "../../packages/tasks", editable = true }
signal-jsonstate = { path = "../../packages/jsonstate", editable = true }
signal-weather = { path = "../../packages/weather", editable = true }
