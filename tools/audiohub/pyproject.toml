[project]
name = "audiohub"
version = "0.1.0"
description = "Voice chat, message kernel, music control and ducking for Claude on this PC."
authors = [
    { email = "owner@example.com" }
]
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "aiohttp==3.14.5",
    "claude-agent-sdk==0.2.168",
    "comtypes==1.4.17",
    "faster-whisper==1.2.1",
    "kokoro-onnx==0.6.1",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.27.0.42",
    "psutil==7.2.2",
    "pycaw==20260927",
    "pysilero-vad==3.4.0",
    # The voice hand-off: reads the orchestrator's claim and sends to its inbox
    # through the console's own sender (packages/orchestrator, stdlib only).
    "signal-orchestrator",
    # The model and effort lists voice's pick (brain-choice.json) is checked
    # against, shared with the console that writes it (packages/modelchoice, stdlib only).
    "signal-modelchoice",
    "sounddevice==0.5.6",
    "soxr==1.1.0",
    "spotipy==2.26.0",
    "winrt-runtime==3.2.1",
    "winrt-windows-foundation==3.2.1",
    "winrt-windows-foundation-collections==3.2.1",
    "winrt-windows-media-control==3.2.1",
]

[project.scripts]
audiohub = "audiohub.cli.main:main"

[tool.uv.sources]
signal-orchestrator = { path = "../../packages/orchestrator", editable = true }
signal-modelchoice = { path = "../../packages/modelchoice", editable = true }

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share basenames across the mirrored folders
# without needing __init__.py files in tests/.
addopts = ["--import-mode=importlib"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
