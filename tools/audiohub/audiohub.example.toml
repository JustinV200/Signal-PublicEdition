# audiohub example config.
#
# Copy this file to audiohub.toml (same folder; gitignored) and edit what you need.
# Every key is optional. Leave a key or a whole [section] out to keep its default.
# The values below ARE the defaults. Unknown keys or wrong types are an error.
# Pass a different file with `audiohub --config PATH <command>`.

[audio]
# Sound devices. Either a case-insensitive name substring (e.g. "BT-Glasses" for the
# glasses) or a device index from `audiohub devices`. Leave unset for the system
# default. Name matches prefer the WASAPI host API, then MME, and are looked up
# again on every stream open (indexes change when Bluetooth reconnects), so
# prefer names over indexes. The --input-device / --output-device flags override these.
# input_device = "BT-Glasses"
# output_device = "BT-Glasses"
# Barge-in: keep the mic live while Claude speaks, so you can interrupt by voice.
# "Stop" (with or without "Claude") cuts Claude off and cancels, like "Claude,
# stop". "Hey Claude, <request>" cuts Claude off and asks the new request, and a
# bare "Hey Claude" cuts it off and waits for one. Anything else said over Claude
# is ignored. A transcript
# that mostly repeats the sentences Claude said in the last echo_tail_s plus a
# second (its own voice echoed into the mic) never interrupts. Once you have
# heard Claude stop (reply_after_s below), a reply needs no wake phrase. Until
# echo_tail_s it is dropped only if it is Claude's last words in order (their
# echo), give or take a misheard word, and for 4 s after that only if it is 3+
# words and exactly Claude's last words. A stop or a wake phrase also gets the
# looser checks.
# false = half-duplex: the mic is muted while Claude speaks and for echo_tail_s
# after; for 4 s after that, a transcript of 3+ words mostly from Claude's last
# few, in any order, is dropped.
barge_in = true
# Seconds Claude's voice may still reach the mic after it was sent (0-10).
# Bluetooth output lags about 1.7 s. With barge-in off the mic stays muted this
# long after Claude stops (audio buffered meanwhile is discarded). With barge-in
# on, what the mic hears during this time still has to pass the echo check and
# the stop/wake rules above. Too short and the mic hears Claude's last words.
# A transcript that echoes Claude's last words is dropped either way.
echo_tail_s = 2.0
# With barge-in on: seconds after Claude's audio ends before what you say counts
# as a reply (0-10, capped at echo_tail_s). That is about when you hear Claude
# stop: Bluetooth lags about 1.7 s, so an utterance that begins sooner is almost
# always Claude's own voice, and only "stop" or a wake phrase counts then, as
# over Claude. Every echo dropped and every other utterance begun in the tail is
# logged with when it began, to tune this from both sides. Phone mode adds its
# extra lag ([phone] echo_tail_s minus echo_tail_s) to this: 1.3 becomes 1.8.
reply_after_s = 1.3
# Play a short two-tone chime when Claude hears its wake phrase ("Hey Claude"
# on its own, or a request starting with it), so you know it's listening.
# It plays through the same output as Claude's voice (glasses or phone page)
# and ducks the music the same way.
wake_chime = true
# Chime loudness: its peak level, 0.0 (silent) to 1.0 (full scale).
wake_chime_volume = 0.45

[ducking]
# Turn music down while Claude speaks, then put it back exactly as it was.
enabled = true
# Process names whose Windows audio sessions get ducked (case-insensitive).
processes = ["Spotify.exe"]
# Fraction of the current session volume to fade to (0.0 = silent, 1.0 = no change).
level = 0.15
# Fade duration in milliseconds, for both ducking and restoring. 0 = instant.
fade_ms = 250

[stt]
# faster-whisper model, device ("cuda" or "cpu") and CTranslate2 compute type.
model = "large-v3-turbo"
device = "cuda"
compute_type = "float16"
# Model used on CPU (int8) when CUDA is unavailable.
fallback_model = "small.en"
# Spoken language code.
language = "en"

[vad]
# Silero speech probability (0.0-1.0) above which a frame counts as speech.
threshold = 0.5
# Silence that ends an utterance, in milliseconds.
min_silence_ms = 700
# Speech shorter than this is treated as a blip and dropped, in milliseconds.
min_speech_ms = 250
# Audio kept from before speech starts, in milliseconds.
pre_roll_ms = 300
# Utterances are force-ended after this many seconds.
max_utterance_s = 30

[tts]
# Kokoro voice. British male voices: bm_george, bm_fable, bm_lewis, bm_daniel.
voice = "bm_george"
# Speaking speed, 0.5 to 2.0.
speed = 1.0
# Kokoro language code.
lang = "en-gb"

[brain]
# Claude model and effort for the voice session, always passed explicitly (so
# the repo's local settings can't change them). model is one of default, best,
# fable, opus, sonnet, haiku, opus[1m], sonnet[1m], opusplan; effort one of low,
# medium, high, xhigh. The console's Voice model pick (.cache/brain-choice.json)
# overrides both from the next request on.
model = "sonnet"
effort = "low"
# Voice is a thin, fast layer: music, the whiteboard, the brief, sleep mode and
# quick lookups. It runs the tools below without asking, and hands every other
# job to the main Signal session (the hand-off itself is never asked about).
# Any tool not listed here is refused quietly, and Claude offers the hand-off.
# Reads of secrets (.env files, token folders, credentials) are always refused.
# Tools by exact name: reads, web search, the read-only mail and sessions tools,
# and the brief.
auto_allow_tools = [
    "Read", "Glob", "Grep", "WebSearch",
    "mcp__mail__mail_accounts", "mcp__mail__mail_search", "mcp__mail__mail_read",
    "mcp__mail__mail_thread",
    "mcp__sessions__list_sessions", "mcp__sessions__list_managed_sessions",
    "mcp__sessions__list_repos", "mcp__sessions__session_status",
    # The brief, minus brief_log and brief_undo (text voice reads mustn't log or undo).
    "mcp__brief__brief_me", "mcp__brief__brief_get", "mcp__brief__brief_ack",
    "mcp__brief__brief_resolve", "mcp__brief__away_on", "mcp__brief__away_off",
    "mcp__brief__away_status",
]
# MCP servers, by exact name as in .mcp.json, whose every tool runs without
# asking. Look-alikes such as "audiohub_x" don't count.
auto_allow_mcp_servers = ["audiohub", "whiteboard", "sleepmode"]
# Seconds a Claude turn may show no activity at all (no text, tool call or tool
# result) before the hub gives up on it and says so (minimum 1). A request
# waiting for a turn Claude started on its own gives up on that turn after the
# same stretch of inactivity. Activity resets the clock, so busy turns may run
# any length of time, but a single tool call that runs longer than this
# without output ends the request.
turn_stall_timeout_s = 300

[kernel]
# Model that orders and condenses every message spoken to the user.
model = "sonnet"
# Messages longer than this many words may be condensed for speech.
max_spoken_words = 80
# Seconds between re-checks of held messages.
hold_recheck_s = 30
# Seconds to wait for a dispatcher decision before using the fallback order.
decision_timeout_s = 8

[wake]
# Phrases that address Claude (case- and punctuation-insensitive). "hey signal"
# also works as a trailing ", signal"; bare "signal" never wakes at the start.
phrases = ["hey claude", "claude", "hey signal"]
# When false, every utterance goes to Claude.
require_wake = true
# Seconds after Claude speaks during which a reply needs no wake phrase
# (0 = every reply needs it).
follow_up_s = 8

[ipc]
# Address of the hub's notification server (used by `audiohub notify` and MCP).
host = "127.0.0.1"
port = 8765
# Notifications are dropped unspoken while the owner is asleep (sleepmode) or away
# (the brief's away mode). Defaults: tools/sleepmode/.state/state.json and
# tools/brief/.state/away.json. A missing or unreadable file counts as awake.
# sleep_state_file = "C:/path/to/state.json"
# away_state_file = "C:/path/to/away.json"

[phone]
# The phone bridge (`audiohub run --phone`, see PHONE.md). The page server always
# binds 127.0.0.1; `tailscale serve` forwards the phone to this port.
port = 8781
# Host names the phone page may be loaded from besides localhost: this PC's
# Tailscale MagicDNS name, e.g. ["pc.tail1234.ts.net"]. Empty = local only.
allowed_hosts = []
# [audio] echo_tail_s for phone mode (0-10), which replaces it there: network
# and phone Bluetooth lag more. [audio] reply_after_s moves by the difference.
# [audio] barge_in applies to phone mode too.
echo_tail_s = 2.5

[music]
# Which music control to use:
#   "auto"    Spotify Web API, falling back to the Windows media session for
#             play/pause/skip/now-playing when Spotify isn't set up, isn't logged
#             in, or has no active device.
#   "spotify" Spotify Web API only (needs Premium, SPOTIPY_CLIENT_ID and
#             `audiohub music login`).
#   "smtc"    Windows media session only (no login; no search, queue or volume).
backend = "auto"
# OAuth redirect URI. Must match the one registered on your Spotify developer app
# exactly. Spotify rejects "localhost"; use the 127.0.0.1 loopback address.
redirect_uri = "http://127.0.0.1:8888/callback"
# Pause the music while you talk with Claude: from the wake phrase until the
# conversation is over (Claude is done and the follow-up window has closed).
# Despite the name, it also pauses the music around anything else the hub
# says, such as a notification. Music that wasn't playing is never started.
# It is resumed only if it is still paused on the same track (or Claude
# skipped to a new one) and Claude wasn't asked to play or pause it. So music
# you had paused before the wake phrase stays paused, and so does music you
# ask Claude to pause; music you start meanwhile keeps playing. Music the hub
# paused that you play and then pause again yourself during the conversation
# isn't noticed, and resumes.
# Stopping the hub (Ctrl+C) mid-conversation leaves the music paused.
pause_on_wake = true
# Seconds to wait after the conversation ends before resuming (0-60).
resume_after_s = 2
