[project]
name = "brief-tool"
version = "0.1.0"
description = "Signal's brief: the brief MCP server, the brief CLI and the Claude Code prompt hook."
authors = [
    { email = "owner@example.com" }
]
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    # The brief MCP tools. Same pin as tools/audiohub, sessions, whiteboard and sleepmode.
    "mcp==2.3.0",
    # The event log, away mode, presence and composer (packages/brief, stdlib only).
    "signal-brief",
    # The data frame for model-bound text (packages/untrusted, stdlib only).
    "signal-untrusted",
    # signal-brief's lock and atomic files (packages/jsonstate); listed so uv finds its path.
    "signal-jsonstate",
]

[project.scripts]
brief = "brief_tool.cli:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.uv.sources]
signal-brief = { path = "../../packages/brief", editable = true }
signal-untrusted = { path = "../../packages/untrusted", editable = true }
signal-jsonstate = { path = "../../packages/jsonstate", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share basenames across the mirrored folders
# without needing __init__.py files in tests/. `support` holds shared fakes.
addopts = ["--import-mode=importlib"]
pythonpath = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
