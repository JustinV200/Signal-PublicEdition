[project]
name = "claude-sessions"
version = "0.1.0"
description = "Start, resume and drive headless Claude Code sessions in the owner's local repos."
authors = [
    { email = "owner@example.com" }
]
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    # Same pins as tools/audiohub: one SDK/CLI version and one MCP version across the repo.
    "claude-agent-sdk==0.2.168",
    "mcp==2.3.0",
    # The shared owner Allow/Deny dialog (packages/confirm, stdlib only).
    "signal-confirm",
    # The shared voice-hub notification client (packages/hubnotify, stdlib only).
    "signal-hub-notify",
]

[project.scripts]
sessions = "claude_sessions.cli:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "claude_sessions"

[tool.uv.sources]
signal-confirm = { path = "../../packages/confirm", editable = true }
signal-hub-notify = { path = "../../packages/hubnotify", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share basenames across the mirrored folders
# without needing __init__.py files in tests/. `support` holds shared fakes.
addopts = ["--import-mode=importlib"]
pythonpath = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
