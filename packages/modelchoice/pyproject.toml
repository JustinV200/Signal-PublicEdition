[project]
name = "signal-modelchoice"
version = "0.1.0"
description = "The models and efforts a Signal session may be switched to, and voice's brain-choice.json."
authors = [
    { email = "owner@example.com" }
]
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = []

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share basenames with other projects' tests
# without needing __init__.py files in tests/.
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
