[project]
name = "signal-confirm"
version = "0.1.0"
description = "Owner Allow/Deny dialog shared by the Signal tools; runs in a short-lived child process."
authors = [
    { email = "owner@example.com" }
]
requires-python = "==3.12.*"
license = "PolyForm-Noncommercial-1.0.0"
# Standard library only (tkinter, subprocess, asyncio).
dependencies = []

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share basenames with other projects' tests
# without needing __init__.py files in tests/.
addopts = ["--import-mode=importlib", "-m", "not desktop"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "desktop: shows a real window on the desktop (run explicitly with -m desktop)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
